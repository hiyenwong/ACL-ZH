name: Benchmark self-test

on:
  push:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-selftest.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark-selftest.yml"
  workflow_dispatch:

jobs:
  scorer-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: No-op must fail all hidden oracles
        run: |
          rm -rf /tmp/aclzh-noop
          python benchmark/agent-eval/run.py             --manifest benchmark/tasks/manifest.jsonl             --variant baseline             --agent noop             --agent-command 'true'             --repetitions 1             --output /tmp/aclzh-noop
          python - <<'PY'
          import glob, json
          rows=[]
          for f in glob.glob('/tmp/aclzh-noop/*.jsonl'):
              rows += [json.loads(x) for x in open(f, encoding='utf-8') if x.strip()]
          assert len(rows) == 6, len(rows)
          assert sum(r['task_success'] for r in rows) == 0, rows
          assert sum(r['hidden_oracle_pass'] for r in rows) == 0, rows
          print('noop self-test: PASS')
          PY

      - name: Reference agent must pass all hidden oracles
        run: |
          rm -rf /tmp/aclzh-reference
          python benchmark/agent-eval/run.py             --manifest benchmark/tasks/manifest.jsonl             --variant full             --agent reference             --agent-command 'python "$GITHUB_WORKSPACE/benchmark/agent-eval/reference_agent.py" "{prompt_file}"'             --repetitions 1             --output /tmp/aclzh-reference
          python - <<'PY'
          import glob, json
          rows=[]
          for f in glob.glob('/tmp/aclzh-reference/*.jsonl'):
              rows += [json.loads(x) for x in open(f, encoding='utf-8') if x.strip()]
          assert len(rows) == 6, len(rows)
          failed=[r for r in rows if not r['task_success']]
          assert not failed, failed
          print('reference self-test: PASS')
          PY

      - name: Aggregate smoke test
        run: |
          python benchmark/agent-eval/aggregate.py /tmp/aclzh-reference/*.jsonl

      - name: Ablation harness smoke test
        run: |
          rm -rf /tmp/aclzh-ablation
          for VARIANT in full full_minus_action full_minus_reference full_minus_constraint full_minus_flow full_minus_validation; do
            python benchmark/agent-eval/run.py               --manifest benchmark/tasks/manifest-ablation.jsonl               --variant "$VARIANT"               --agent reference               --agent-command 'python "$GITHUB_WORKSPACE/benchmark/agent-eval/reference_agent.py" "{prompt_file}"'               --repetitions 1               --output /tmp/aclzh-ablation
          done
          python - <<'PY'
          import glob, json
          rows=[]
          for f in glob.glob('/tmp/aclzh-ablation/*.jsonl'):
              rows += [json.loads(x) for x in open(f, encoding='utf-8') if x.strip()]
          assert len(rows) == 36, len(rows)
          variants={r['variant'] for r in rows}
          assert variants == {'full','full_minus_action','full_minus_reference','full_minus_constraint','full_minus_flow','full_minus_validation'}, variants
          print('ablation harness self-test: PASS')
          PY

      - name: File-block parser regression test
        run: |
          python benchmark/local-model/selftest_file_block_parser.py

      - name: Web-manual input scorer self-test
        run: |
          python benchmark/web-eval/selftest.py

      - name: Web bundle completeness gate must reject missing responses
        run: |
          rm -rf /tmp/aclzh-web-incomplete
          mkdir -p /tmp/aclzh-web-incomplete
          for VARIANT in baseline minimal full; do
            python benchmark/web-eval/export_web_prompts.py               --manifest benchmark/tasks/manifest.jsonl               --variant "$VARIANT"               --output "/tmp/aclzh-web-incomplete/$VARIANT"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          exp=json.loads(Path('benchmark/web-eval/experiments/web-smoke-gpt-oss-20b-v0.1.json').read_text(encoding='utf-8'))
          root=Path('/tmp/aclzh-web-incomplete')
          manifest=[]
          for i,entry in enumerate(exp['run_order'],1):
              task,variant=entry.split(':',1)
              manifest.append({
                  'run':i,'task_id':task,'variant':variant,
                  'prompt':f'{variant}/{task}-{variant}.md',
                  'response':f'responses/{i:02d}-{task}-{variant}.diff'
              })
          (root/'run-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'responses').mkdir(exist_ok=True)
          PY
          set +e
          python benchmark/web-eval/score_bundle.py             --experiment benchmark/web-eval/experiments/web-smoke-gpt-oss-20b-v0.1.json             --bundle /tmp/aclzh-web-incomplete             --manifest benchmark/tasks/manifest.jsonl             --output /tmp/aclzh-web-score
          CODE=$?
          set -e
          test "$CODE" -eq 2

      - name: Validate pinned web smoke experiment
        run: |
          python benchmark/web-eval/validate_experiment.py \
            benchmark/web-eval/experiments/web-smoke-gpt-oss-20b-v0.1.json

      - name: Validate output comprehension item set
        run: |
          python benchmark/output/prose-comprehension/validate_items.py \
            benchmark/output/prose-comprehension/items/items-v0.2.jsonl

      - name: Self-test blind review anonymization
        run: |
          python benchmark/output/prose-comprehension/blind-review/selftest.py \
            benchmark/output/prose-comprehension/items/items-v0.2.jsonl
