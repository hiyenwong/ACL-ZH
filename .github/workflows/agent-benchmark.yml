name: Agent benchmark

on:
  push:
    paths:
      - ".github/workflows/agent-benchmark.yml"
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Runs per task and variant"
        required: true
        default: "5"
        type: string
      timeout_seconds:
        description: "Per-agent-run timeout"
        required: true
        default: "600"
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [codex, claude]
    env:
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ACLZH_REPETITIONS: ${{ github.event_name == 'push' && '1' || inputs.repetitions }}
      ACLZH_TIMEOUT: ${{ github.event_name == 'push' && '600' || inputs.timeout_seconds }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check credentials
        id: auth
        shell: bash
        run: |
          if [ "${{ matrix.agent }}" = "codex" ]; then
            if [ -z "${CODEX_ACCESS_TOKEN:-}" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Codex smoke skipped: CODEX_ACCESS_TOKEN is not configured."
            else
              echo "available=true" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Claude smoke skipped: ANTHROPIC_API_KEY is not configured."
            else
              echo "available=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Record skipped status
        if: steps.auth.outputs.available != 'true'
        shell: bash
        run: |
          mkdir -p benchmark/results/agent-ci
          printf '{"agent":"%s","status":"skipped","reason":"credential-not-configured"}\n'             "${{ matrix.agent }}" > benchmark/results/agent-ci/status.json

      - name: Install agent
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.agent }}" = "codex" ]; then
            npm install -g @openai/codex
            codex --version
          else
            npm install -g @anthropic-ai/claude-code
            claude --version
          fi

      - name: Run Baseline / Minimal / Full
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark/results/agent-ci

          if [ "${{ matrix.agent }}" = "codex" ]; then
            AGENT_CMD='codex exec --json --full-auto - < "{prompt_file}"'
            VERSION_CMD='codex --version'
          else
            AGENT_CMD='cat "{prompt_file}" | claude -p --output-format json --max-turns 20 --dangerously-skip-permissions'
            VERSION_CMD='claude --version'
          fi

          for VARIANT in baseline minimal full; do
            python benchmark/agent-eval/run.py               --manifest benchmark/tasks/manifest.jsonl               --variant "$VARIANT"               --agent "${{ matrix.agent }}"               --agent-command "$AGENT_CMD"               --repetitions "$ACLZH_REPETITIONS"               --timeout-seconds "$ACLZH_TIMEOUT"               --cli-version-command "$VERSION_CMD"               --run-label "github-actions-${GITHUB_RUN_ID}"               --output benchmark/results/agent-ci
          done

      - name: Aggregate
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          python benchmark/agent-eval/aggregate.py benchmark/results/agent-ci/*.jsonl             | tee benchmark/results/agent-ci/aggregate.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acl-zh-${{ matrix.agent }}-${{ github.run_id }}
          path: benchmark/results/agent-ci/
          if-no-files-found: error
          retention-days: 30
